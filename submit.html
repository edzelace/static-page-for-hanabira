<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit a Quote — Hanabira Archives</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="static/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Crimson Pro', serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-2xl mx-auto p-6">
    <div class="text-center mb-6">
      <img src="static/logo.png" alt="Hanabira Archives Logo" class="w-16 h-16 mx-auto rounded-full">
      <h1 class="text-3xl font-bold mt-2">Submit a Quote</h1>
      <p class="text-gray-600 text-sm">Share a memorable line from an anime, web novel, or light novel.</p>
    </div>

    <div class="mb-4 p-4 rounded-xl bg-blue-50 text-blue-800">
      This is a static page. Submission functionality is not available on GitHub Pages.
    </div>

    <form class="space-y-4" aria-disabled="true">
      <div>
        <label for="anime" class="sr-only">Anime / Novel</label>
        <input id="anime" type="text" name="anime" placeholder="Anime / Novel" required class="w-full p-2 border rounded-xl" disabled />
      </div>
      <div>
        <label for="character" class="sr-only">Character</label>
        <input id="character" type="text" name="character" placeholder="Character" required class="w-full p-2 border rounded-xl" disabled />
      </div>
      <div>
        <label for="quote" class="sr-only">Quote</label>
        <textarea id="quote" name="quote" rows="4" placeholder="The quote..." required class="w-full p-2 border rounded-xl" disabled></textarea>
      </div>
      <button type="button" class="bg-gray-400 text-white px-4 py-2 rounded-xl cursor-not-allowed opacity-90">
        Submit
      </button>
      <p class="text-xs text-gray-500 mt-1">In the future, we plan to allow real submissions.</p>
    </form>

    <div class="text-center mt-6">
      <a href="index.html" class="text-blue-500 hover:underline">← Back to Home</a>
    </div>
  </div>

  <footer class="text-center text-sm text-gray-500 mt-10 py-4 border-t">
