<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hanabira Archives - A collection of memorable anime and wuxia quotes.">

  <title>Hanabira Archives</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Enable Tailwind dark mode class strategy -->
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <!-- Favicon and Fonts -->
  <link rel="icon" type="image/png" href="static/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Crimson Pro', serif;
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans transition-colors duration-300">
  <div class="max-w-3xl mx-auto p-6">
    
    <!-- Logo and Title -->
    <div class="flex flex-col items-center mb-6">
      <img src="static/logo.png" alt="Hanabira Archives Logo" class="w-24 h-24 mb-2 rounded-full shadow-md hover:scale-105 transition-transform duration-200">
      <h1 class="text-4xl font-bold tracking-widest">Hanabira Archives</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 italic">Where memories blossom again.</p>
    </div>

    <!-- Search Inputs -->
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input id="anime" type="text" placeholder="Filter by Anime" class="p-2 border border-gray-300 dark:border-gray-700 rounded-xl w-full bg-white dark:bg-gray-800 text-black dark:text-white" />
      <input id="character" type="text" placeholder="Filter by Character" class="p-2 border border-gray-300 dark:border-gray-700 rounded-xl w-full bg-white dark:bg-gray-800 text-black dark:text-white" />
      <input id="keyword" type="text" placeholder="Search by Keyword" class="p-2 border border-gray-300 dark:border-gray-700 rounded-xl w-full bg-white dark:bg-gray-800 text-black dark:text-white" />
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-4 mb-6">
      <button onclick="getRandomQuote()" class="bg-blue-500 text-white px-4 py-2 rounded-xl hover:bg-blue-600">Random Quote</button>
      <button onclick="searchQuotes()" class="bg-green-500 text-white px-4 py-2 rounded-xl hover:bg-green-600">Search</button>
    </div>

    <!-- Quote Display -->
    <div id="quote-container" class="space-y-6"></div>
  </div>

  <!-- Footer -->
  <footer class="fixed bottom-0 left-0 w-full bg-white dark:bg-gray-800 border-t dark:border-gray-700 text-center p-4 text-sm text-gray-600 dark:text-gray-400 flex flex-col items-center gap-1">
    <span>Unique visitors:</span>

    <!-- Statcounter Code -->
    <script type="text/javascript">
      var sc_project = 13133176;
      var sc_invisible = 0;
      var sc_security = "28dbd58b";
      var scJsHost = "https://";
      document.write("<sc" + "ript type='text/javascript' src='" + scJsHost + "statcounter.com/counter/counter.js'></" + "script>");
    </script>
    <noscript>
      <div class="statcounter">
        <a title="Web Analytics Made Easy - Statcounter" href="https://statcounter.com/" target="_blank">
          <img class="statcounter" src="https://c.statcounter.com/13133176/0/28dbd58b/0/" alt="Statcounter Analytics" referrerPolicy="no-referrer-when-downgrade">
        </a>
      </div>
    </noscript>
    <!-- End of StatCounter Code -->

    <span>· © <a href="https://less-real.com" class="text-blue-500 hover:underline">less-real.com</a> · Reimagined as Hanabira Archives</span>
  </footer>

  <!-- Dark Mode Toggle -->
  <button onclick="toggleDarkMode()" class="fixed bottom-4 right-4 bg-gray-300 dark:bg-gray-700 text-black dark:text-white px-4 py-2 rounded-full shadow-lg hover:scale-105 transition-all">
    Toggle Dark Mode
  </button>

  <!-- Scripts -->
  <script>
    async function getRandomQuote() {
      try {
        const res = await fetch('https://animewuxia-quotes-site.onrender.com/quotes/random');
        if (!res.ok) throw new Error('Failed to fetch data');
        const data = await res.json();
        displayQuotes([data]);
      } catch (error) {
        console.error(error);
        alert('Something went wrong, please try again later.');
      }
    }

    async function searchQuotes() {
      const anime = document.getElementById('anime').value;
      const character = document.getElementById('character').value;
      const keyword = document.getElementById('keyword').value;
      const params = new URLSearchParams({ anime, character, keyword });

      const res = await fetch(`https://animewuxia-quotes-site.onrender.com/quotes?${params.toString()}`);
      const data = await res.json();
      if (data.length > 0) displayQuotes(data);
      else {
        document.getElementById('quote-container').innerHTML = `
          <div class="bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-2xl shadow-md p-6">
            <p class="text-xl italic mb-4">No matching quotes found.</p>
          </div>`;
      }
    }

    function displayQuotes(quotes) {
      const container = document.getElementById('quote-container');
      container.innerHTML = '';
      quotes.forEach((quote) => {
        const div = document.createElement('div');
        div.className = 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-2xl shadow-md p-6';
        div.innerHTML = `
          <p class="text-xl italic mb-4">"${quote.quote}"</p>
          <p class="text-right text-sm text-gray-500 dark:text-gray-400">- ${quote.character} (${quote.anime})</p>
        `;
        container.appendChild(div);
      });
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    getRandomQuote();
  </script>
</body>
</html>
